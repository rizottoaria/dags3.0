name: Deploy DAGs to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repo structure (debug)
        run: |
          pwd
          ls -la
          echo "---"
          find . -name "*.py" -not -path "./.git/*" | head -20

      - name: Setup SSH key
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_PATH: ${{ secrets.TARGET_PATH }}
        run: |
          # trim accidental whitespace/newlines pasted into secrets, which
          # otherwise silently break the unquoted rsync destination below
          echo "SSH_USER=$(printf '%s' "$SSH_USER" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "SSH_HOST=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "SSH_PORT=$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "TARGET_PATH=$(printf '%s' "$TARGET_PATH" | tr -d '[:space:]')" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Ensure rsync is installed
        run: |
          command -v rsync >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq rsync)

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README*' \
            --exclude='*.md' \
            --exclude='.env*' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='dbt/**/target/' \
            --exclude='dbt/**/logs/' \
            --exclude='dbt/**/.env' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./ \
            "$SSH_USER@$SSH_HOST:$TARGET_PATH/"
