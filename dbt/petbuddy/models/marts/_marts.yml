version: 2

models:
  - name: dim_players
    description: "Профиль игрока: активность, атрибуты, LTV."
    columns:
      - name: player_id
        data_tests:
          - not_null
          - unique

  - name: mart_daily_active_users
    description: "DAU, новые/вернувшиеся, сессии, выручка и ARPDAU по дням."
    columns:
      - name: event_date
        data_tests:
          - not_null
          - unique

  - name: fct_revenue_events
    description: >
      Факт платёжных событий (одна строка = один платёж). revenue_amount у purchase —
      в ИСХОДНОЙ валюте (см. currency); складывать между валютами нельзя, для агрегатов
      revenue_amount_usd. ad_reward — уже в USD.
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique
      - name: currency
        description: "Валюта revenue_amount ('USD' для ad_reward и бэкфилла; исходная валюта покупки иначе)."
      - name: revenue_amount_usd
        description: "Сумма в USD: ad_reward = как есть; purchase = конверсия по int_currency_rates_usd."

  - name: mart_revenue_daily
    description: >
      Выручка по дням и типу в USD с ARPU/ARPPU. ad_reward из fct_revenue_events (USD),
      purchase из int_iap_usd (авторитетный USD-гибрид) — сырые purchase в исходной
      валюте не суммируются.
    columns:
      - name: event_date
        data_tests:
          - not_null

  - name: fct_economy_flows
    description: "Движение игровых валют (приход/расход), одна строка на валюту события."

  - name: mart_currency_flows_daily
    description: "Дневные source/sink и net-flow по каждой валюте."

  - name: mart_currency_balance_daily
    description: "Средние остатки валют у игроков по дням (balanceSnapshot)."
